<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#155d6c">
  <script>
    (() => {
      document.documentElement.dataset.theme = "light";
      document.documentElement.dataset.themeLocked = "light";
      document.documentElement.style.colorScheme = "light";
    })();
  </script>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="Discover Canarias">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Choose your language | Discover Canarias</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/platform-polish.css">
</head>

<body class="welcome-screen">
  <main class="welcome-stage">
    <section class="welcome-cover" aria-labelledby="welcome-title">
      <div class="welcome-cover-shade"></div>

      <header class="welcome-cover-header">
        <div class="welcome-brand" aria-label="Discover tour" data-app-name-aria-label>
          <span class="brand-symbol brand-symbol-small" aria-hidden="true">
            <span class="brand-symbol-dot"></span>
          </span>
          <span data-app-name>Discover tour</span>
        </div>

        <button
          id="language-toggle-button"
          class="welcome-language-toggle"
          type="button"
          aria-controls="language-sheet"
          aria-expanded="true"
        >
          <span id="selected-language-code">EN</span>
          <span aria-hidden="true">⌄</span>
        </button>
      </header>

      <div class="welcome-cover-copy">
        <p class="eyebrow eyebrow-light" data-i18n="welcomeEyebrow">
          A self-guided walking tour
        </p>

        <h1 id="welcome-title">
          <span data-welcome-title-prefix>Discover</span>
          <span data-welcome-title-place>Tour</span>
        </h1>

        <span class="welcome-coral-rule" aria-hidden="true"></span>

        <p class="welcome-tagline" data-i18n="welcomeTagline">
          Explore the selected walking tour.
        </p>

        <div class="welcome-stats" aria-label="Tour details">
        </div>
      </div>

      <div class="welcome-actions">
        <div class="welcome-start-options">
          <button
            id="start-tour-button"
            class="button button-coral welcome-start-button"
            type="button"
            data-i18n="startFromBeginning"
            disabled
          >
            Start from beginning
          </button>

          <button
            id="start-near-me-button"
            class="button welcome-location-button"
            type="button"
            disabled
            hidden
          >
            <span class="welcome-location-icon" aria-hidden="true">⌖</span>
            <span data-i18n="startNearMe">Start near me</span>
          </button>
        </div>

        <p
          id="location-start-status"
          class="welcome-location-status"
          role="status"
          aria-live="polite"
          hidden
        ></p>

        <button
          id="change-language-button"
          class="welcome-change-language"
          type="button"
          data-i18n="changeLanguage"
        >
          Change language
        </button>
      </div>
    </section>

    <section
      id="language-sheet"
      class="welcome-language-sheet is-open"
      aria-labelledby="language-title"
    >
      <div class="language-sheet-handle" aria-hidden="true"></div>

      <div class="language-sheet-heading">
        <div>
          <p class="eyebrow" data-app-name>Discover tour</p>

          <h2 id="language-title" data-i18n="chooseLanguage">
            Choose your language
          </h2>

          <p class="text-muted" data-i18n="chooseLanguageHelp">
            You can change this later.
          </p>
        </div>

        <button
          id="language-sheet-close"
          class="language-sheet-close"
          type="button"
          aria-label="Close language selection"
        >
          ×
        </button>
      </div>

      <div
        id="language-grid"
        class="language-grid"
        aria-live="polite"
      ></div>

      <p
        id="language-selection-message"
        class="form-help"
        data-i18n="selectLanguageFirst"
      >
        Choose a language to continue.
      </p>
    </section>

    <section
      id="location-start-sheet"
      class="location-start-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="location-start-title"
      hidden
    >
      <div class="location-start-handle" aria-hidden="true"></div>

      <p class="eyebrow" data-i18n="locationNearestStop">
        Nearest stop
      </p>

      <h2 id="location-start-title"></h2>

      <p
        id="location-start-distance"
        class="location-start-distance"
      ></p>

      <p
        class="location-start-privacy"
        data-i18n="locationPrivacyNote"
      >
        Your location is used only on this device to find the nearest stop.
      </p>

      <div class="location-start-actions">
        <button
          id="location-start-confirm"
          class="button button-coral"
          type="button"
          data-i18n="locationStartHere"
        >
          Start here
        </button>

        <a
          id="location-view-route"
          class="button button-secondary"
          href="route.html"
          data-i18n="locationViewRoute"
        >
          View full route
        </a>

        <button
          id="location-start-cancel"
          class="location-start-cancel"
          type="button"
          data-i18n="locationCancel"
        >
          Cancel
        </button>
      </div>
    </section>
  </main>

  <script src="js/data-loader.js"></script>
  <script src="js/common.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/location-start.js"></script>
  <script src="js/index.js"></script>
  <script src="js/register-sw.js"></script>
</body>
</html>
