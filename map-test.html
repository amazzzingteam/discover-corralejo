<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#155d6c">
  
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="Discover Canarias">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Discover tour local map test</title>
  <link rel="stylesheet" href="assets/vendor/maplibre-gl.css">
  <style>
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    .map-error {
      box-sizing: border-box;
      width: min(90%, 600px);
      margin: 40px auto;
      padding: 20px;
      color: #252525;
      background: #fffdf8;
      border: 1px solid #ff6c66;
      border-radius: 12px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="js/data-loader.js"></script>
  <script src="js/common.js"></script>
  <script src="assets/vendor/maplibre-gl.js"></script>
  <script src="assets/vendor/pmtiles.js"></script>
  <script src="js/navigation-map.js"></script>
  <script>
    async function initialiseMapTestPage() {
      try {
        const mapConfig = getTourMapConfig();
        const viewConfig = getTourMapViewConfig("test");
        const archiveUrl = getTourMapArchiveUrl();

        initialisePmtilesProtocol(archiveUrl);

        const map = new maplibregl.Map({
          container: "map",
          style: createTourMapStyle(archiveUrl),
          center: mapConfig.center,
          zoom: viewConfig.zoom,
          minZoom: viewConfig.minZoom ?? mapConfig.minZoom,
          maxZoom: viewConfig.maxZoom ?? mapConfig.maxZoom,
          maxBounds: viewConfig.bounds || mapConfig.bounds,
          attributionControl: false
        });

        map.addControl(new maplibregl.NavigationControl(), "top-right");
        map.addControl(
          new maplibregl.AttributionControl({ compact: true }),
          "bottom-right"
        );

        map.on("load", () => {
          console.log(
            `Local ${getActiveTourId() || "tour"} PMTiles map loaded successfully.`
          );
        });
      } catch (error) {
        console.error(error);
        document.querySelector("#map").innerHTML = `
          <div class="map-error">
            <strong>The selected tour map could not load.</strong>
            <p>Open the browser console for the exact error.</p>
          </div>
        `;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      startTourPage(initialiseMapTestPage);
    });
  </script>
</body>
</html>
