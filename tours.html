<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#155d6c">
  <script>
    (() => {
      document.documentElement.dataset.theme = "light";
      document.documentElement.dataset.themeLocked = "light";
      document.documentElement.style.colorScheme = "light";
    })();
  </script>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="Discover Canarias">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Choose your tour | Discover Canarias</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/platform-polish.css">
</head>

<body class="tour-selector-screen">
  <main class="tour-selector-stage">
    <header class="tour-selector-hero">
      <div class="tour-selector-brand" aria-label="Discover Canarias">
        <span class="brand-symbol brand-symbol-small" aria-hidden="true">
          <span class="brand-symbol-dot"></span>
        </span>
        <span>Discover Canarias</span>
      </div>

      <div class="tour-selector-copy">
        <p class="eyebrow eyebrow-light" id="tour-selector-eyebrow">
          Self-guided walking tours
        </p>
        <h1 id="tour-selector-title">Choose your tour</h1>
        <p id="tour-selector-intro">
          Select the place you want to explore. Each tour opens in the same simple mobile guide.
        </p>
      </div>
    </header>

    <section class="tour-selector-panel" aria-labelledby="tour-selector-title">
      <div
        id="tour-list"
        class="tour-selector-list"
        aria-live="polite"
        aria-busy="true"
      >
        <article class="tour-selector-card tour-selector-card-loading">
          <p>Loading tours…</p>
        </article>
      </div>

      <p class="tour-selector-note" id="tour-selector-note">
        More tours will appear here as they are added.
      </p>

      <noscript>
        <p class="tour-selector-error">
          JavaScript is required to load the available tours.
        </p>
      </noscript>
    </section>
  </main>

  <script src="js/tours.js"></script>
  <script src="js/register-sw.js"></script>
</body>
</html>
