<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#155d6c">
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem("discoverCorralejo:theme");
        const theme = savedTheme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (_) {
        document.documentElement.dataset.theme = "light";
        document.documentElement.style.colorScheme = "light";
      }
    })();
  </script>

  
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="Discover Corralejo">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Thank you | Tour app</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/platform-polish.css">
</head>

<body class="feedback-screen">
  <main class="page-container feedback-page-container">
    <section class="content-section completion-card">
      <div
        class="completion-symbol"
        aria-hidden="true"
      >
        ✓
      </div>

      <h1 data-i18n="feedbackThankYouTitle">
        Thank you for your feedback
      </h1>

      <p data-i18n="feedbackThankYouBody">
        Your feedback has been submitted.
      </p>

      <a
        class="button"
        href="route.html?view_source=feedback_complete"
        data-i18n="returnToTour"
      >
        Return to tour
      </a>
    </section>
  </main>

  <script src="js/data-loader.js"></script>
  <script src="js/common.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/feedback-complete.js"></script>
  <script src="js/register-sw.js"></script>
</body>
</html>
